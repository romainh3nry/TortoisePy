# Suite de tests sur chaque pull request et sur les deux branches
# longues. Gratuit : le dépôt est public, et GitHub n'y facture pas
# les runners hébergés.
#
# Le but n'est pas d'informer mais de BLOQUER : la protection de
# `main` (Settings → Branches) exige ce job avant toute fusion. Sans
# elle, la CI afficherait une croix que rien n'empêcherait d'ignorer.

name: tests

# `pull_request` seulement pour les TESTS. Mesuré : le commit de
# fusion dans `main` a un contenu rigoureusement identique à celui
# déjà testé sur la PR — « Update branch » y a intégré `main` avant
# la fusion, et la protection de branche l'exige. Les relancer
# coûtait dix minutes pour refaire le même travail, et retardait
# d'autant la pose du tag.
#
# Le job `tag`, lui, se déclenche sur `push: main` : voir sa propre
# note.
on:
  pull_request:
  push:
    branches: [main, develop]

# Une PR poussée plusieurs fois d'affilée n'a pas besoin de ses
# exécutions précédentes : on annule, et on n'occupe pas la file.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # La version se pose à la main dans `pyproject.toml` — seul endroit
  # où elle s'écrit désormais. Ce job la vérifie AVANT les tests :
  # une version déjà taguée échouait jusqu'ici dix minutes plus tard,
  # dans le job `tag`, après une suite entière pour rien.
  check_version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Les tags doivent être connus pour comparer : un clone
          # superficiel ne les rapporte pas.
          fetch-depth: 0

      - name: La version avance-t-elle, et est-elle libre ?
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)

          if [ -z "$version" ]; then
            echo "::error::version introuvable dans pyproject.toml"
            exit 1
          fi

          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "::error::v$version est déjà taguée — montez la version dans pyproject.toml"
            exit 1
          fi

          # Comparaison NUMÉRIQUE : en ordre alphabétique, « 0.9.0 »
          # passerait pour supérieur à « 0.14.0 ».
          dernier=$(git tag --list 'v*' | sed 's/^v//' | sort -V | tail -1)
          if [ -n "$dernier" ]; then
            plus_grand=$(printf '%s\n%s\n' "$dernier" "$version" | sort -V | tail -1)
            if [ "$plus_grand" != "$version" ]; then
              echo "::error::$version ne suit pas la dernière version publiée ($dernier)"
              exit 1
            fi
          fi

          echo "::notice::v$version : libre et postérieure à v$dernier"

  pytest:
    # Inutile de lancer dix minutes de tests sur une version qui sera
    # refusée au moment de taguer.
    needs: check_version
    # Pas sur `push: main` : ce commit a déjà été testé sur la PR, au
    # contenu près (vérifié avec `git diff` entre les deux).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # La suite tourne en ~9 min localement ; un runner est plus lent.
    # La limite évite qu'un test bloqué occupe une heure entière.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # PySide6 réclame ces bibliothèques même en mode offscreen :
      # sans elles, l'import échoue sur `libEGL.so.1` introuvable, et
      # le message ne nomme pas la cause.
      - name: Dépendances système de Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libdbus-1-3

      # Les tests lancent `git` en sous-processus. Ils fournissent tous
      # une identité par variables d'environnement, mais `git init`
      # avertirait encore sur la branche par défaut.
      - name: Identité Git
        run: |
          git config --global init.defaultBranch main
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"

      - run: pip install -e ".[dev]"

      # `QT_QPA_PLATFORM` est déjà posé par `tests/conftest.py`, avant
      # le premier import de PySide6 ; on ne le répète pas ici.
      - run: pytest -q

  # Le tag est posé par la CI, et non depuis un poste de travail :
  # il lit la version dans le code RÉELLEMENT fusionné, donc aucun
  # écart n'est possible entre ce que le tag annonce et ce que le
  # paquet contient. C'est la garantie qu'un script local n'a pas —
  # deux incidents de tag mal placé l'ont montré.
  #
  # Pas de `needs: pytest` : sur `main`, les tests ne tournent plus
  # (ils l'ont fait sur la PR, au contenu identique). La protection
  # de branche exige déjà `pytest` vert ET la branche à jour avant
  # toute fusion — rien ne peut donc atteindre `main` sans avoir été
  # éprouvé.
  #
  # Il lit la version dans `pyproject.toml`, source unique : c'est elle
  # que `importlib.metadata` sert à `topy --version`, et elle
  # qu'installent pip et uv. Un fichier de version séparé en ferait une
  # seconde, et le jour où les deux divergent, le tag annoncerait
  # autre chose que le paquet.
  tag:
    # Uniquement sur `main`, et seulement après une fusion — jamais
    # depuis une pull request, où le code n'est pas encore en
    # production.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # sans quoi la poussée du tag est refusée

    steps:
      - uses: actions/checkout@v4
        with:
          # Les tags doivent être connus pour savoir si celui-ci
          # existe déjà ; un clone superficiel ne les rapporte pas.
          fetch-depth: 0

      - name: Taguer si la version est nouvelle
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)

          if [ -z "$version" ]; then
            echo "::error::version introuvable dans pyproject.toml"
            exit 1
          fi

          # Trois fusions sur huit ne changent pas la version (mesuré
          # sur l'historique) : une correction, une synchronisation.
          # L'existence du tag est le signal — pas besoin d'un fichier
          # dédié pour dire « ceci est une version ».
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "v$version existe déjà : fusion sans changement de version."
            exit 0
          fi

          git tag "v$version"
          git push origin "v$version"
          echo "::notice::Tag v$version posé sur $(git rev-parse --short HEAD)"

      - name: Publier la release
        # Dans le MÊME job que le tag : un job séparé devrait
        # récupérer le dépôt à nouveau pour une seule commande, et
        # pourrait s'exécuter alors que le tag a échoué.
        #
        # Un tag suffit à installer — `curl | sh` ne lit que lui —
        # mais la release est ce qu'affiche l'onglet du dépôt et le
        # fil des personnes qui le suivent. Les quatorze premières
        # versions en avaient une ; les trois suivantes, posées par
        # script, n'en ont pas, et l'historique semblait s'arrêter.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)

          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version déjà publiée."
            exit 0
          fi

          # `--generate-notes` rédige les notes depuis les commits et
          # les PR fusionnées : rien à écrire à la main, et le contenu
          # suit ce qui a réellement changé.
          gh release create "v$version" \
            --title "v$version" \
            --generate-notes
          echo "::notice::Release v$version publiée"

  # Après la release, `develop` reçoit le commit de fusion de `main`.
  # Demandé par l'utilisateur, et fait trois fois à la main jusqu'ici.
  #
  # Sans cette remise à niveau, la pull request suivante affiche
  # « This branch is out-of-date with the base branch » et impose un
  # clic sur « Update branch » — la protection exige d'avoir intégré
  # `main` avant de fusionner.
  sync_develop:
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Reporter main dans develop
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "develop contient déjà main : rien à faire."
            exit 0
          fi

          # `--no-ff` : une fusion explicite, comme les trois faites à
          # la main. Un rebase réécrirait `develop`, que d'autres
          # postes ont pu récupérer.
          if ! git merge --no-ff origin/main -m "Merge branch 'main' into develop"; then
            # Un conflit ne doit pas rester à moitié appliqué : on
            # annule, et on le signale pour résolution manuelle.
            git merge --abort
            echo "::error::Conflit entre main et develop — à résoudre à la main"
            exit 1
          fi

          git push origin develop
          echo "::notice::develop remis à niveau sur main"

  # Ouvre la pull request quand la VERSION change sur `develop`.
  # Demandé par l'utilisateur, avec cette précision : détecter la
  # ligne et non le fichier.
  #
  # Mesuré sur l'historique : deux commits ont modifié
  # `pyproject.toml` sans toucher la version — l'ajout de PyYAML, et
  # une dépendance pour la coloration syntaxique. Un déclencheur sur
  # le fichier seul aurait ouvert deux pull requests inutiles.
  open_pr:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ouvrir la PR si la version a changé
        env:
          GH_TOKEN: ${{ github.token }}
          AVANT: ${{ github.event.before }}
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)

          # L'état AVANT le push, et non `HEAD^` : un push peut porter
          # plusieurs commits, et la montée de version pourrait être
          # dans le premier d'entre eux.
          #
          # Le `0000…` est la valeur que GitHub donne à la création
          # d'une branche : il n'y a alors rien à comparer.
          if [ -z "${AVANT:-}" ] || [ "$AVANT" = "0000000000000000000000000000000000000000" ]; then
            echo "Pas d'état antérieur : rien à comparer."
            exit 0
          fi

          precedente=$(git show "$AVANT:pyproject.toml" 2>/dev/null \
            | grep -m1 '^version' | cut -d'"' -f2 || true)

          if [ "$version" = "$precedente" ]; then
            echo "Version inchangée ($version) : pas de pull request."
            exit 0
          fi

          # Une PR déjà ouverte se met à jour toute seule quand on
          # pousse : en ouvrir une seconde échouerait.
          if [ -n "$(gh pr list --base main --head develop --state open --json number --jq '.[].number')" ]; then
            echo "Une pull request est déjà ouverte."
            exit 0
          fi

          gh pr create \
            --base main --head develop \
            --title "v$version" \
            --body "Version $precedente → $version. Fusion automatique dès que la CI est verte, puis tag et release."
          echo "::notice::Pull request ouverte pour la v$version"

          # Fusion automatique, demandée par l'utilisateur : monter la
          # version sur `develop` VAUT décision de publier.
          #
          # `--auto` ne fusionne pas tout de suite : GitHub attend que
          # les contrôles exigés passent. Un échec de `check_version`
          # ou de `pytest` laisse donc la pull request ouverte, et
          # rien ne part. C'est la protection de branche qui tient la
          # garantie, pas ce job.
          #
          # `|| true` : si la fusion automatique est refusée (réglage
          # du dépôt désactivé), la PR reste ouverte et se fusionne à
          # la main. Un confort perdu ne doit pas faire rougir la CI.
          if gh pr merge --auto --merge; then
            echo "::notice::Fusion automatique armée"
          else
            echo "::warning::Fusion automatique indisponible — à fusionner à la main"
          fi
