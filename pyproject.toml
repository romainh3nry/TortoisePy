[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tortoisepy"
version = "0.1.0"
description = "TortoiseGit Revision Graph pour macOS"
requires-python = ">=3.13"
dependencies = ["pygit2>=1.15", "PySide6>=6.7"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-qt>=4.4"]

[project.scripts]
tgraph = "tortoisepy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Les PNG de l'icône voyagent avec le paquet : sans cette déclaration,
# ils ne sont pas installés et macOS retombe sur l'icône de Python.
[tool.setuptools.package-data]
tortoisepy = ["resources/*.png", "resources/*.ico", "resources/*.icns"]

[tool.pytest.ini_options]
testpaths = ["tests"]
