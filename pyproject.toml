[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tortoisepy"
version = "0.11.0"
description = "TortoiseGit's Revision Graph, for macOS and Windows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "Romain Henry" }]
keywords = ["git", "graph", "gui", "tortoisegit", "revision", "blame"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = ["pygit2>=1.15", "PySide6>=6.7", "Pygments>=2.17"]

[project.urls]
Homepage = "https://github.com/romainh3nry/TortoisePy"
Issues = "https://github.com/romainh3nry/TortoisePy/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-qt>=4.4"]

[project.scripts]
topy = "tortoisepy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Les PNG de l'icône voyagent avec le paquet : sans cette déclaration,
# ils ne sont pas installés et macOS retombe sur l'icône de Python.
[tool.setuptools.package-data]
tortoisepy = ["resources/*.png", "resources/*.ico", "resources/*.icns"]

[tool.pytest.ini_options]
testpaths = ["tests"]
